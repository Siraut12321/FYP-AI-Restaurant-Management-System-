<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Mutton Biryani">
  <rect width="100%" height="100%" fill="#071018" />
  <g transform="translate(100,60)">
    <ellipse cx="300" cy="210" rx="220" ry="80" fill="#2b2b2b" opacity="0.45" />
    <!-- Plate -->
    <circle cx="300" cy="160" r="140" fill="#fff7e9" />
    <circle cx="300" cy="160" r="120" fill="#ffd166" />

    <!-- Rice mound -->
    <path d="M220 160 q80 -60 160 0 q-20 60 -160 0" fill="#f7e1a0" />

    <!-- Garnish -->
    <g fill="#7a3b1a">
      <circle cx="260" cy="140" r="8" />
      <circle cx="320" cy="150" r="8" />
      <circle cx="290" cy="170" r="6" />
    </g>

    <!-- Label -->
    <text x="0" y="330" fill="#e3dcd2" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Mutton Biryani</text>
  </g>
</svg>
