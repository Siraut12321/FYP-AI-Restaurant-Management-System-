  <g transform="translate(60,40)">
    <!-- skewers -->
    <rect x="120" y="160" width="360" height="38" rx="18" fill="#7a3b1a" />
    <rect x="120" y="210" width="360" height="38" rx="18" fill="#7a3b1a" />
    <rect x="120" y="260" width="360" height="38" rx="18" fill="#7a3b1a" />

    <!-- sticks -->
    <rect x="88" y="172" width="36" height="220" rx="18" fill="#c48b4a" />
    <rect x="492" y="172" width="36" height="220" rx="18" fill="#c48b4a" />

    <text x="0" y="360" fill="#e3dcd2" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Seekh Kebab</text>
  </g>
