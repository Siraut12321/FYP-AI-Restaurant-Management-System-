<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Lahori Karahi">
  <rect width="100%" height="100%" fill="#081015" />
  <g transform="translate(80,40)">
    <!-- Karahi pan -->
    <ellipse cx="300" cy="220" rx="220" ry="90" fill="#111" opacity="0.5" />
    <rect x="160" y="110" width="280" height="180" rx="40" fill="#2b2b2b" stroke="#3a3a3a" stroke-width="4" />
    <circle cx="170" cy="200" r="18" fill="#2b2b2b" />

    <!-- Stew -->
    <ellipse cx="300" cy="180" rx="220" ry="70" fill="#ff8c42" />
    <g fill="#7a2b12">
      <ellipse cx="260" cy="160" rx="14" ry="10" />
      <ellipse cx="320" cy="170" rx="16" ry="12" />
      <ellipse cx="300" cy="200" rx="12" ry="8" />
    </g>

    <text x="0" y="330" fill="#e3dcd2" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Lahori Karahi</text>
  </g>
</svg>
